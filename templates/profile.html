{% extends "base.html" %}
{% block title %}My Profile | SkillXchange{% endblock %}
{% block content %}
<div class="container py-5"><div class="page-heading"><span class="eyebrow">PROFILE</span><h1>My Student Profile</h1><p>Keep your academic and availability information current.</p></div>
<div class="panel"><form method="post"><div class="row g-4">
<div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" name="name" value="{{ user.name }}" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input class="form-control" value="{{ user.email }}" disabled></div>
<div class="col-md-6"><label class="form-label">Department</label><select class="form-select" name="department"><option {% if user.department=='CSE' %}selected{% endif %}>CSE</option><option>IT</option><option>ECE</option><option>EEE</option><option>BBA</option><option>MBA</option><option>Other</option></select></div>
<div class="col-md-6"><label class="form-label">Year</label><select class="form-select" name="year">{% for i in range(1,5) %}<option value="{{i}}" {% if user.year==i %}selected{% endif %}>{{i}}{{ 'st' if i==1 else 'nd' if i==2 else 'rd' if i==3 else 'th' }} Year</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Availability</label><input class="form-control" name="availability" value="{{ user.availability }}" placeholder="e.g. Saturday, Sunday"></div>
<div class="col-12"><label class="form-label">Short Bio</label><textarea class="form-control" name="bio" rows="4" placeholder="Tell other students about yourself...">{{ user.bio }}</textarea></div>
</div><button class="btn btn-primary mt-4">Save Changes</button></form></div></div>
{% endblock %}
